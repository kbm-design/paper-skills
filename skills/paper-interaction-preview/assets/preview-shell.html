<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SYSTEM_NAME}} — Interactions</title>
<style>
  /* ===== page chrome (leave alone) ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --canvas: {{CANVAS_BG}};        /* product background */
    --chrome-fg: {{CHROME_FG}};     /* page-chrome text, readable on canvas */
    --chrome-dim: {{CHROME_DIM}};   /* captions / labels */
    --chrome-line: {{CHROME_LINE}}; /* hairlines */
  }
  body {
    background: var(--canvas);
    font-family: system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 48px clamp(24px, 6vw, 80px) 120px;
  }
  .page-header { padding-bottom: 12px; border-bottom: 1px solid var(--chrome-line); }
  .page-header h1 { color: var(--chrome-fg); font-size: 15px; font-weight: 600; letter-spacing: -0.1px; }
  .page-header p { color: var(--chrome-dim); font-size: 12px; margin-top: 4px; }

  .specimen { padding: 40px 0; border-bottom: 1px solid var(--chrome-line); }
  .specimen-label { color: var(--chrome-dim); font-size: 11px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 16px; }
  .specimen-row { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
  .specimen-spec { color: var(--chrome-dim); font-size: 12px; font-family: ui-monospace, monospace; margin-top: 14px; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  /* ===== component styles: one commented block per specimen, appended below ===== */
</style>
</head>
<body>
  <header class="page-header">
    <h1>{{SYSTEM_NAME}} — Interactions</h1>
    <p>Live specimens from Paper with motion applied. Hover, press, and tab through them. Refresh after additions.</p>
  </header>

  <main>
    <!-- SPECIMEN TEMPLATE — copy per component, keep the CSS for it grouped in <style> above:
    <section class="specimen">
      <div class="specimen-label">{Component name as in Paper}</div>
      <div class="specimen-row">
        {live component(s) — real <button>/<a>/<input> elements, variants share the row}
      </div>
      <p class="specimen-spec">hover: {deltas} &middot; press: {deltas} &middot; {duration} {easing}</p>
    </section>
    -->

    <!-- /specimens -->
  </main>
</body>
</html>
